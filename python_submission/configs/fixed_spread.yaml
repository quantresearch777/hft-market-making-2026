data:
  source: cmf
  data_dir: data/MD
  levels: 5
  max_events: 100000
  max_lob_rows: 20000
  max_trade_rows: 100000

market:
  tick_size: 0.0000001
  lot_size: 1.0
  maker_fee_bps: -0.5

simulation:
  initial_cash: 0.0
  quote_interval_ns: 100000000
  record_interval_ns: 1000000000
  order_latency_ns: 0
  partial_fills: true
  use_trade_events: true

risk:
  order_qty: 5000.0
  max_inventory: 50000.0

strategy:
  name: fixed_spread
  half_spread_ticks: 2
  inventory_skew_ticks_per_unit: 0.00002

report:
  output_dir: outputs/fixed_spread

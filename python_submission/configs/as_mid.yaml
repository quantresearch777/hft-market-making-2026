data:
  source: cmf
  data_dir: data/MD
  levels: 5
  max_events: 100000
  max_lob_rows: 20000
  max_trade_rows: 100000

market:
  tick_size: 0.0000001
  lot_size: 1.0
  maker_fee_bps: -0.5

simulation:
  initial_cash: 0.0
  quote_interval_ns: 100000000
  record_interval_ns: 1000000000
  order_latency_ns: 0
  partial_fills: true
  use_trade_events: true

risk:
  order_qty: 5000.0
  max_inventory: 50000.0

strategy:
  name: avellaneda_stoikov_mid
  gamma: 0.05
  k: 200000.0
  tau_seconds: 60.0
  vol_window: 300
  min_half_spread_ticks: 1
  max_half_spread_ticks: 25

report:
  output_dir: outputs/as_mid
